<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cloud Tech Tallinn 2026 - My Schedule</title>
  <style>
    :root {
      --bg-dark: #0a0a0a;
      --bg-card: #1a1a1a;
      --text: #e8e8e8;
      --text-dim: #888;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --border: #333;
      --success: #10b981;
      --warning: #f59e0b;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-dark);
      color: var(--text);
      line-height: 1.6;
    }
    
    header {
      padding: 20px;
      background: #111;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    
    header a {
      color: var(--accent);
      text-decoration: none;
    }
    
    header h1 {
      font-size: 1.5rem;
      margin: 10px 0 5px 0;
    }
    
    header p {
      color: var(--text-dim);
      font-size: 0.9rem;
    }
    
    .controls {
      padding: 15px 20px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      position: sticky;
      top: 82px;
      z-index: 99;
    }
    
    .controls input,
    .controls select,
    .controls button {
      padding: 8px 12px;
      background: var(--bg-dark);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 0.9rem;
    }
    
    .controls input {
      flex: 1;
      min-width: 200px;
    }
    
    .controls button {
      cursor: pointer;
      background: var(--accent);
      border-color: var(--accent);
    }
    
    .controls button:hover {
      background: var(--accent-hover);
    }
    
    .loading {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-dim);
    }
    
    .error {
      background: #991b1b;
      color: white;
      padding: 15px 20px;
      margin: 20px;
      border-radius: 4px;
    }
    
    .day-section {
      margin: 20px;
    }
    
    .day-header {
      font-size: 1.3rem;
      font-weight: bold;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--accent);
    }
    
    .session {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 15px;
      margin-bottom: 15px;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    
    .session:hover {
      border-color: var(--accent);
    }
    
    .session.has-notes {
      border-left: 4px solid var(--success);
    }
    
    .session-time {
      color: var(--text-dim);
      font-size: 0.85rem;
      margin-bottom: 5px;
    }
    
    .session-time.now {
      color: var(--success);
      font-weight: bold;
    }
    
    .session-time.next {
      color: var(--warning);
      font-weight: bold;
    }
    
    .session-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 8px;
    }
    
    .session-meta {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      font-size: 0.85rem;
      color: var(--text-dim);
      margin-bottom: 10px;
    }
    
    .session-speakers {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 10px 0;
    }
    
    .speaker-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 5px 10px;
      background: var(--bg-dark);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    
    .speaker-chip:hover {
      border-color: var(--accent);
    }
    
    .speaker-avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      object-fit: cover;
    }
    
    .session-notes {
      margin-top: 12px;
      padding: 12px;
      background: rgba(16, 185, 129, 0.1);
      border-left: 3px solid var(--success);
      border-radius: 4px;
    }
    
    .session-notes-title {
      font-weight: 600;
      color: var(--success);
      margin-bottom: 5px;
      font-size: 0.9rem;
    }
    
    .session-notes ul {
      margin-left: 20px;
      color: var(--text);
    }

    .session-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .session-header-content {
      flex: 1;
    }

    .copy-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 6px 8px;
      cursor: pointer;
      color: var(--text-dim);
      font-size: 0.9rem;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .copy-btn:hover {
      color: var(--accent);
      border-color: var(--accent);
    }

    .copy-btn.copied {
      color: var(--success);
      border-color: var(--success);
    }
    
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.9);
      z-index: 1000;
      overflow-y: auto;
      padding: 20px;
    }
    
    .modal.active {
      display: block;
    }
    
    .modal-content {
      max-width: 700px;
      margin: 40px auto;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 25px;
      position: relative;
    }
    
    .modal-close {
      position: absolute;
      top: 15px;
      right: 15px;
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 1.5rem;
      cursor: pointer;
      padding: 5px 10px;
    }
    
    .modal-close:hover {
      color: var(--text);
    }
    
    .speaker-modal-avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 15px;
    }
    
    .speaker-modal-name {
      font-size: 1.5rem;
      font-weight: bold;
      margin-bottom: 5px;
    }
    
    .speaker-modal-tagline {
      color: var(--text-dim);
      margin-bottom: 15px;
    }
    
    .speaker-modal-bio {
      line-height: 1.8;
      margin: 15px 0;
    }
    
    .speaker-modal-links {
      display: flex;
      gap: 15px;
      margin-top: 15px;
    }
    
    .speaker-modal-links a {
      color: var(--accent);
      text-decoration: none;
    }
    
    .speaker-modal-links a:hover {
      text-decoration: underline;
    }
    
    footer {
      padding: 40px 20px;
      text-align: center;
      color: var(--text-dim);
      border-top: 1px solid var(--border);
      margin-top: 40px;
    }
    
    footer a {
      color: var(--accent);
      text-decoration: none;
    }
    
    footer a:hover {
      text-decoration: underline;
    }
    
    @media (max-width: 640px) {
      header h1 { font-size: 1.2rem; }
      .controls { top: 76px; }
      .session { padding: 12px; }
      .session-title { font-size: 1rem; }
      .modal-content { margin: 20px auto; padding: 20px; }
    }
  </style>
</head>
<body>
  <header>
    <a href="/">← vibes</a>
    <h1>Cloud Tech Tallinn 2026</h1>
    <p>Jan 29-30 • My Schedule & Notes</p>
  </header>

  <div class="controls">
    <input type="search" id="search" placeholder="Search sessions, speakers, topics...">
    <select id="dayFilter">
      <option value="">All days</option>
    </select>
    <select id="trackFilter">
      <option value="">All tracks</option>
    </select>
    <button id="refreshBtn">↻ Refresh</button>
  </div>

  <div id="loading" class="loading">Loading sessions...</div>
  <div id="error" class="error" style="display: none;"></div>
  <div id="sessions"></div>

  <div id="modal" class="modal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()">×</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <footer>
    <a href="/">← Back to launcher</a> | 
    <a href="https://github.com/jukkan/vibes">View source</a>
  </footer>

  <script>
    const SESSIONS_URL = 'data/cttt-sessions.json';
    const SPEAKERS_URL = 'data/cttt-2026-speakers.json';
    const NOTES_URL = 'data/cttt-2026-notes.json';
    
    let allSessions = [];
    let allSpeakers = [];
    let speakersById = {};
    let notes = {};
    
    // Initialize
    async function init() {
      try {
        // Try to load from cache first
        const cached = loadCache();
        if (cached) {
          allSessions = cached.sessions;
          allSpeakers = cached.speakers;
          renderSessions();
          document.getElementById('loading').style.display = 'none';
        }
        
        // Load notes
        await loadNotes();
        
        // Fetch fresh data
        await fetchData();
        
      } catch (err) {
        showError(err.message);
      }
    }
    
    async function fetchData() {
      try {
        const [sessionsRes, speakersRes] = await Promise.all([
          fetch(SESSIONS_URL),
          fetch(SPEAKERS_URL)
        ]);
        
        if (!sessionsRes.ok || !speakersRes.ok) {
          throw new Error('Failed to fetch data files');
        }
        
        allSessions = await sessionsRes.json();
        allSpeakers = await speakersRes.json();
        
        // Build speaker lookup by name for matching
        speakersById = {};
        allSpeakers.forEach(speaker => {
          speakersById[speaker.name] = speaker;
        });
        
        // Cache for offline use
        saveCache({ sessions: allSessions, speakers: allSpeakers });
        
        // Populate filters
        populateFilters();
        
        // Render
        renderSessions();
        document.getElementById('loading').style.display = 'none';
        
      } catch (err) {
        if (allSessions.length === 0) {
          throw err;
        }
        console.warn('Using cached data:', err);
      }
    }
    
    async function loadNotes() {
      try {
        const res = await fetch(NOTES_URL);
        if (res.ok) {
          notes = await res.json();
          renderSessions();
        }
      } catch (err) {
        console.log('No notes file found (expected on first load)');
      }
    }
    
    function populateFilters() {
      // Extract unique days
      const days = [...new Set(allSessions.map(s => s.day))].filter(Boolean).sort();
      const dayFilter = document.getElementById('dayFilter');
      days.forEach(day => {
        const option = document.createElement('option');
        // Get dayLabel from first session of that day
        const session = allSessions.find(s => s.day === day);
        option.value = day;
        option.textContent = session.dayLabel;
        dayFilter.appendChild(option);
      });
      
      // Extract unique topics
      const topics = [...new Set(allSessions.map(s => s.topic))].filter(Boolean).sort();
      const trackFilter = document.getElementById('trackFilter');
      topics.forEach(topic => {
        const option = document.createElement('option');
        option.value = topic;
        option.textContent = topic;
        trackFilter.appendChild(option);
      });
    }
    
    function renderSessions() {
      const container = document.getElementById('sessions');
      const searchTerm = document.getElementById('search').value.toLowerCase();
      const dayFilter = document.getElementById('dayFilter').value;
      const trackFilter = document.getElementById('trackFilter').value;
      
      // Filter sessions
      let filtered = allSessions.filter(session => {
        if (dayFilter && session.day !== dayFilter) return false;
        if (trackFilter && session.topic !== trackFilter) return false;
        
        if (searchTerm) {
          const searchable = [
            session.title,
            session.description,
            session.speakers,
            session.topic,
            session.room
          ].join(' ').toLowerCase();
          
          if (!searchable.includes(searchTerm)) return false;
        }
        
        return true;
      });
      
      // Group by day
      const byDay = {};
      filtered.forEach(session => {
        const day = session.day || 'unknown';
        if (!byDay[day]) byDay[day] = [];
        byDay[day].push(session);
      });
      
      // Sort days
      const sortedDays = Object.keys(byDay).sort();
      
      // Render
      container.innerHTML = '';
      
      if (filtered.length === 0) {
        container.innerHTML = '<div class="loading">No sessions found</div>';
        return;
      }
      
      sortedDays.forEach(day => {
        const daySection = document.createElement('div');
        daySection.className = 'day-section';
        
        const dayHeader = document.createElement('div');
        dayHeader.className = 'day-header';
        // Get day label from first session
        const dayLabel = byDay[day][0].dayLabel || day;
        dayHeader.textContent = dayLabel;
        daySection.appendChild(dayHeader);
        
        // Sort sessions by time
        byDay[day].sort((a, b) => {
          if (!a.time) return 1;
          if (!b.time) return -1;
          return a.time.localeCompare(b.time);
        });
        
        byDay[day].forEach(session => {
          const sessionEl = renderSession(session);
          daySection.appendChild(sessionEl);
        });
        
        container.appendChild(daySection);
      });
    }
    
    function renderSession(session) {
      const div = document.createElement('div');
      div.className = 'session';
      
      const sessionNotes = notes[session.id];
      if (sessionNotes) {
        div.classList.add('has-notes');
      }
      
      // Header with time, title, and copy button
      const headerDiv = document.createElement('div');
      headerDiv.className = 'session-header';

      const headerContent = document.createElement('div');
      headerContent.className = 'session-header-content';

      // Time
      const timeDiv = document.createElement('div');
      timeDiv.className = 'session-time';
      timeDiv.textContent = session.time || 'Time TBA';
      headerContent.appendChild(timeDiv);

      // Title
      const titleDiv = document.createElement('div');
      titleDiv.className = 'session-title';
      titleDiv.textContent = session.title;
      headerContent.appendChild(titleDiv);

      headerDiv.appendChild(headerContent);

      // Copy button
      const copyBtn = document.createElement('button');
      copyBtn.className = 'copy-btn';
      copyBtn.textContent = '📋';
      copyBtn.title = 'Copy session info to clipboard';
      copyBtn.onclick = (e) => copySessionInfo(session, e);
      headerDiv.appendChild(copyBtn);

      div.appendChild(headerDiv);
      
      // Meta
      const metaDiv = document.createElement('div');
      metaDiv.className = 'session-meta';
      
      if (session.room) {
        const roomSpan = document.createElement('span');
        roomSpan.textContent = `📍 ${session.room}`;
        metaDiv.appendChild(roomSpan);
      }
      
      if (session.topic) {
        const topicSpan = document.createElement('span');
        topicSpan.textContent = `🏷️ ${session.topic}`;
        metaDiv.appendChild(topicSpan);
      }
      
      if (session.level) {
        const levelSpan = document.createElement('span');
        levelSpan.textContent = `📊 Level ${session.level}`;
        metaDiv.appendChild(levelSpan);
      }
      
      div.appendChild(metaDiv);
      
      // Speakers (from scraped data - comma-separated string)
      if (session.speakers) {
        const speakersDiv = document.createElement('div');
        speakersDiv.className = 'session-speakers';
        
        const speakerNames = session.speakers.split(',').map(s => s.trim());
        speakerNames.forEach(speakerName => {
          const speaker = speakersById[speakerName];
          if (speaker) {
            const chip = document.createElement('div');
            chip.className = 'speaker-chip';
            chip.onclick = (e) => {
              e.stopPropagation();
              showSpeakerModal(speaker);
            };
            
            if (speaker.photo) {
              const img = document.createElement('img');
              img.className = 'speaker-avatar';
              img.src = speaker.photo;
              img.alt = speaker.name;
              chip.appendChild(img);
            }
            
            const name = document.createElement('span');
            name.textContent = speaker.name;
            chip.appendChild(name);
            
            speakersDiv.appendChild(chip);
          } else {
            // Speaker not found in our data, show name only
            const chip = document.createElement('div');
            chip.className = 'speaker-chip';
            const name = document.createElement('span');
            name.textContent = speakerName;
            chip.appendChild(name);
            speakersDiv.appendChild(chip);
          }
        });
        
        div.appendChild(speakersDiv);
      }
      
      // Notes
      if (sessionNotes) {
        const notesDiv = document.createElement('div');
        notesDiv.className = 'session-notes';
        
        const notesTitle = document.createElement('div');
        notesTitle.className = 'session-notes-title';
        notesTitle.textContent = '📝 My notes:';
        notesDiv.appendChild(notesTitle);
        
        if (Array.isArray(sessionNotes.notes) && sessionNotes.notes.length > 0) {
          const ul = document.createElement('ul');
          sessionNotes.notes.forEach(note => {
            const li = document.createElement('li');
            li.textContent = note;
            ul.appendChild(li);
          });
          notesDiv.appendChild(ul);
        } else if (typeof sessionNotes.notes === 'string') {
          const p = document.createElement('p');
          p.textContent = sessionNotes.notes;
          notesDiv.appendChild(p);
        }
        
        div.appendChild(notesDiv);
      }
      
      div.onclick = () => showSessionModal(session);
      
      return div;
    }
    
    function showSessionModal(session) {
      const modal = document.getElementById('modal');
      const body = document.getElementById('modalBody');
      
      let html = `<h2>${session.title}</h2>`;
      
      if (session.time) {
        html += `<p><strong>⏰ ${session.time}</strong></p>`;
      }
      
      if (session.room) {
        html += `<p><strong>📍 ${session.room}</strong></p>`;
      }
      
      if (session.topic) {
        html += `<p><strong>🏷️ ${session.topic}</strong> ${session.level ? `• Level ${session.level}` : ''}</p>`;
      }
      
      if (session.description) {
        html += `<p style="margin-top: 15px; line-height: 1.8;">${session.description}</p>`;
      }
      
      if (session.speakers) {
        html += '<div style="margin-top: 20px;"><strong>Speakers:</strong></div>';
        html += '<div style="display: flex; flex-direction: column; gap: 15px; margin-top: 10px;">';
        
        const speakerNames = session.speakers.split(',').map(s => s.trim());
        speakerNames.forEach(speakerName => {
          const speaker = speakersById[speakerName];
          if (speaker) {
            const speakerJson = JSON.stringify(speaker).replace(/"/g, '&quot;');
            html += `
              <div style="display: flex; gap: 15px; align-items: start; cursor: pointer; padding: 10px; background: var(--bg-dark); border-radius: 4px;" 
                   onclick='showSpeakerModal(${speakerJson})'>
                ${speaker.photo ? `<img src="${speaker.photo}" style="width: 50px; height: 50px; border-radius: 50%; object-fit: cover;">` : ''}
                <div>
                  <div style="font-weight: 600;">${speaker.name}</div>
                  ${speaker.tagline ? `<div style="color: var(--text-dim); font-size: 0.85rem;">${speaker.tagline}</div>` : ''}
                </div>
              </div>
            `;
          } else {
            html += `
              <div style="padding: 10px; background: var(--bg-dark); border-radius: 4px;">
                <div style="font-weight: 600;">${speakerName}</div>
              </div>
            `;
          }
        });
        html += '</div>';
      }
      
      body.innerHTML = html;
      modal.classList.add('active');
    }
    
    function showSpeakerModal(speaker) {
      const modal = document.getElementById('modal');
      const body = document.getElementById('modalBody');
      
      let html = '';
      
      if (speaker.photo) {
        html += `<img src="${speaker.photo}" class="speaker-modal-avatar" alt="${speaker.name}">`;
      }
      
      html += `<div class="speaker-modal-name">${speaker.name}</div>`;
      
      if (speaker.tagline) {
        html += `<div class="speaker-modal-tagline">${speaker.tagline}</div>`;
      }
      
      if (speaker.bio) {
        html += `<div class="speaker-modal-bio">${speaker.bio}</div>`;
      }
      
      body.innerHTML = html;
      modal.classList.add('active');
    }
    
    function closeModal() {
      document.getElementById('modal').classList.remove('active');
    }

    function copySessionInfo(session, event) {
      event.stopPropagation();

      const lines = [session.title];
      if (session.speakers) {
        lines.push(`Speaker(s): ${session.speakers}`);
      }
      lines.push(`Session ID: ${session.id}`);

      const text = lines.join('\n');

      navigator.clipboard.writeText(text).then(() => {
        const btn = event.currentTarget;
        btn.classList.add('copied');
        btn.textContent = '✓';
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.textContent = '📋';
        }, 1500);
      }).catch(err => {
        console.error('Failed to copy:', err);
      });
    }
    
    function saveCache(data) {
      try {
        localStorage.setItem('cttt2026_cache', JSON.stringify(data));
        localStorage.setItem('cttt2026_cache_time', Date.now().toString());
      } catch (err) {
        console.warn('Failed to cache data:', err);
      }
    }
    
    function loadCache() {
      try {
        const cached = localStorage.getItem('cttt2026_cache');
        const cacheTime = localStorage.getItem('cttt2026_cache_time');
        
        if (cached && cacheTime) {
          const age = Date.now() - parseInt(cacheTime);
          // Cache valid for 6 hours
          if (age < 6 * 60 * 60 * 1000) {
            return JSON.parse(cached);
          }
        }
      } catch (err) {
        console.warn('Failed to load cache:', err);
      }
      return null;
    }
    
    function showError(message) {
      const errorDiv = document.getElementById('error');
      errorDiv.textContent = `Error: ${message}. Using cached data if available.`;
      errorDiv.style.display = 'block';
      document.getElementById('loading').style.display = 'none';
    }
    
    // Event listeners
    document.getElementById('search').addEventListener('input', renderSessions);
    document.getElementById('dayFilter').addEventListener('change', renderSessions);
    document.getElementById('trackFilter').addEventListener('change', renderSessions);
    document.getElementById('refreshBtn').addEventListener('click', () => {
      document.getElementById('loading').style.display = 'block';
      fetchData();
      loadNotes();
    });
    
    // Close modal on background click
    document.getElementById('modal').addEventListener('click', (e) => {
      if (e.target.id === 'modal') {
        closeModal();
      }
    });
    
    // Initialize
    init();
  </script>
</body>
</html>
