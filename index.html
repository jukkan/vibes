  <style>
    :root {
      --font-display: 'Cormorant Garamond', Georgia, serif;
      --font-mono: 'Space Grotesk', monospace;
      --font-body: system-ui, -apple-system, sans-serif;
      
      --color-midnight: #0f1419;
      --color-ink: #f0f0f0;
      --color-slate: #c8d3e0;
      --color-muted: #8b98a8;
      --color-dim: #4a5568;
      --color-surface: #1a1f2e;
      --color-surface-elevated: #252b3a;
      --color-border: #2d3748;
      --color-accent: #6b9fff;
      --color-accent-bright: #8fb3ff;
      --color-accent-dim: rgba(107, 159, 255, 0.15);
      
      --spacing-xs: 8px;
      --spacing-sm: 16px;
      --spacing-md: 24px;
      --spacing-lg: 32px;
      --spacing-xl: 48px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-body);
      background: var(--color-midnight);
      color: var(--color-ink);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: var(--spacing-xl) var(--spacing-md);
      flex: 1;
    }

    header {
      margin-bottom: var(--spacing-xl);
      text-align: left;
    }

    h1 {
      font-family: var(--font-display);
      font-size: clamp(3rem, 8vw, 5rem);
      font-weight: 300;
      font-style: italic;
      letter-spacing: -0.02em;
      line-height: 1;
      color: var(--color-ink);
      margin-bottom: var(--spacing-xs);
    }

    .subtitle {
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--color-muted);
    }

    .tools-list {
      display: flex;
      flex-direction: column;
      gap: 1px;
      background: var(--color-border);
      border: 1px solid var(--color-border);
    }

    .tool-item {
      background: var(--color-surface);
      padding: var(--spacing-md);
      text-decoration: none;
      color: var(--color-ink);
      display: flex;
      gap: var(--spacing-lg);
      transition: all 0.2s ease;
      cursor: pointer;
      position: relative;
    }

    .tool-item:hover {
      background: var(--color-surface-elevated);
      box-shadow: inset 4px 0 0 var(--color-accent);
    }

    .tool-item.expanded {
      background: var(--color-surface-elevated);
    }

    .tool-content {
      flex: 1;
      min-width: 0;
    }

    .tool-visual {
      width: 120px;
      height: 120px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.5;
      transition: all 0.3s ease;
      filter: drop-shadow(0 0 12px rgba(107, 159, 255, 0.3));
    }

    .tool-item:hover .tool-visual {
      opacity: 0.8;
      filter: drop-shadow(0 0 20px rgba(107, 159, 255, 0.5));
      transform: scale(1.05);
    }

    .tool-visual svg {
      width: 100%;
      height: 100%;
      stroke: var(--color-accent-bright);
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .tool-header {
      display: flex;
      align-items: baseline;
      gap: var(--spacing-sm);
      margin-bottom: var(--spacing-xs);
    }

    .tool-label {
      font-family: var(--font-mono);
      font-size: 0.625rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--color-accent-bright);
      padding: 3px 8px;
      background: var(--color-accent-dim);
      border: 1px solid rgba(107, 159, 255, 0.25);
      border-radius: 2px;
      flex-shrink: 0;
    }

    .tool-title {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 400;
      font-style: italic;
      color: var(--color-ink);
      line-height: 1.2;
    }

    .tool-summary {
      font-size: 0.875rem;
      color: var(--color-slate);
      line-height: 1.5;
      margin-top: 4px;
    }

    .tool-description {
      font-size: 0.8125rem;
      color: var(--color-muted);
      line-height: 1.7;
      margin-top: var(--spacing-sm);
      padding-top: var(--spacing-sm);
      border-top: 1px solid var(--color-border);
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: all 0.3s ease;
    }

    .tool-item.expanded .tool-description {
      max-height: 300px;
      opacity: 1;
    }

    footer {
      margin-top: var(--spacing-xl);
      padding: var(--spacing-xl) var(--spacing-md);
      border-top: 1px solid var(--color-border);
      background: var(--color-midnight);
    }

    .footer-content {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: var(--spacing-sm);
      font-size: 0.75rem;
      color: var(--color-dim);
    }

    .footer-links {
      display: flex;
      gap: var(--spacing-sm);
      align-items: center;
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.625rem;
    }

    .footer-links span {
      color: var(--color-border);
    }

    .footer-credit {
      padding-top: var(--spacing-md);
      border-top: 1px solid var(--color-border);
      font-size: 0.8125rem;
      color: var(--color-muted);
      line-height: 1.6;
    }

    footer a {
      color: var(--color-accent);
      text-decoration: none;
      transition: all 0.15s ease;
      position: relative;
    }

    footer a:hover {
      color: var(--color-accent-bright);
    }

    footer a::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 0;
      height: 1px;
      background: var(--color-accent-bright);
      transition: width 0.2s ease;
    }

    footer a:hover::after {
      width: 100%;
    }

    @media (max-width: 640px) {
      h1 {
        font-size: 2.5rem;
      }
      
      .container {
        padding: var(--spacing-lg) var(--spacing-sm);
      }

      .tool-item {
        gap: var(--spacing-md);
      }

      .tool-header {
        flex-direction: column;
        gap: 4px;
      }

      .tool-visual {
        width: 60px;
        height: 60px;
        opacity: 0.4;
      }

      .tool-item:hover .tool-visual {
        opacity: 0.6;
      }
    }
  </style>

    function renderTools() {
      const container = document.getElementById('tools-list');
      
      tools.forEach((tool, index) => {
        const item = document.createElement('a');
        item.className = 'tool-item';
        item.href = tool.path;
        item.dataset.index = index;
        
        item.innerHTML = `
          <div class="tool-content">
            <div class="tool-header">
              <span class="tool-label">${tool.label}</span>
              <h2 class="tool-title">${tool.title}</h2>
            </div>
            <div class="tool-summary">${tool.summary}</div>
            <div class="tool-description">${tool.description}</div>
          </div>
          <div class="tool-visual">${tool.visual}</div>
        `;

        // Click to expand/collapse
        item.addEventListener('click', (e) => {
          if (!e.ctrlKey && !e.metaKey) {
            e.preventDefault();
            
            // If clicking the same item, navigate
            if (item.classList.contains('expanded')) {
              window.location.href = tool.path;
              return;
            }
            
            // Collapse all others
            document.querySelectorAll('.tool-item').forEach(t => {
              if (t !== item) t.classList.remove('expanded');
            });
            
            // Toggle current
            item.classList.toggle('expanded');
          }
        });
        
        container.appendChild(item);
      });
    }

    renderTools();
